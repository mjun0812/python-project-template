name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check shell scripts
        run: |
          shellcheck docker/*.sh
          test -z "$(shfmt --list docker/*.sh)"

      - name: Format
        run: uv run --frozen ruff format . --check --diff

      - name: Lint
        run: uv run --frozen ruff check --output-format=github .

      - name: Type check
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest --cov
